name: price-watch
run-name: ${{ inputs.mode == 'commands' && 'telegram' || 'price-watch' }}

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 min (GitHub may start runs a few minutes late)
  workflow_dispatch:         # cron-job.org (no inputs = all), the Cloudflare relay (mode=commands), manual runs
    inputs:
      mode:
        description: "all = check prices + Telegram; commands = only answer Telegram (fast)"
        type: choice
        options: [all, commands]
        default: all

permissions:
  contents: write          # the bot commits watches.yaml when Telegram commands change it

# Price runs and Telegram runs queue separately, so a button never waits for a price check.
# They don't share memory: price runs use state.json (Actions cache), Telegram runs keep the
# menu in the Cloudflare Worker. Each queue keeps one waiting run; messages wait in the Worker.
concurrency:
  group: price-watch-${{ inputs.mode || 'all' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Price memory (state.json) lives in the Actions cache, not in git:
      # a run every 10 min would otherwise mean ~144 commits a day.
      - name: Restore price memory
        if: inputs.mode != 'commands'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Check prices
        env:
          # Per watch owner, the first configured channel wins: Telegram > ntfy > WhatsApp.
          # ntfy (current): one secret topic per person.
          NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
          # Telegram: one bot token + one chat id per person.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_ME: ${{ secrets.TELEGRAM_CHAT_ID_ME }}
          TELEGRAM_CHAT_ID_GF: ${{ secrets.TELEGRAM_CHAT_ID_GF }}
          NTFY_TOPIC_GF: ${{ secrets.NTFY_TOPIC_GF }}
          # WhatsApp via CallMeBot (used for an owner without a Telegram chat id).
          PHONE_ME: ${{ secrets.PHONE_ME }}
          CALLMEBOT_APIKEY_ME: ${{ secrets.CALLMEBOT_APIKEY_ME }}
          # Cloudflare relay for instant Telegram replies (without these: getUpdates every run).
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          MODE: ${{ inputs.mode || 'all' }}
        run: python -m pricebot.main --mode "$MODE"

      # watches.yaml is only a readable copy of the Worker's list. When a price run and a
      # Telegram run both rewrite it at once, the newer copy wins the conflict (-X theirs =
      # this run's commit during a rebase); any run after that writes it fresh again anyway.
      - name: Save watch list changes (Telegram commands)
        if: always()
        run: |
          if git diff --quiet -- watches.yaml; then exit 0; fi
          git config user.name "price-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watches.yaml
          git commit -q -m "Update watches from Telegram commands"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::could not push watches.yaml (only a copy; the next run retries)"

      - name: Save price memory
        if: always() && inputs.mode != 'commands' && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
