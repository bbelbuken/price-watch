name: price-watch

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 min (GitHub may start runs a few minutes late)
  workflow_dispatch:         # "Run workflow" button for manual tests

permissions:
  contents: read

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Price memory (state.json) lives in the Actions cache, not in git:
      # a run every 10 min would otherwise mean ~144 commits a day.
      - name: Restore price memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Check prices
        env:
          # Per watch owner, the first configured channel wins: Telegram > ntfy > WhatsApp.
          # ntfy (current): one secret topic per person.
          NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
          # Telegram: one bot token + one chat id per person.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_ME: ${{ secrets.TELEGRAM_CHAT_ID_ME }}
          # WhatsApp via CallMeBot (used for an owner without a Telegram chat id).
          PHONE_ME: ${{ secrets.PHONE_ME }}
          CALLMEBOT_APIKEY_ME: ${{ secrets.CALLMEBOT_APIKEY_ME }}
        run: python -m pricebot.main

      - name: Save price memory
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
