name: price-watch

on:
  schedule:
    - cron: "17 * * * *"  # every hour at :17 (UTC; GitHub may start a few minutes late)
  workflow_dispatch:       # "Run workflow" button for manual tests

permissions:
  contents: write          # to commit state.json back

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          # One PHONE_/CALLMEBOT_APIKEY_ pair per watch owner in watches.yaml.
          PHONE_ME: ${{ secrets.PHONE_ME }}
          CALLMEBOT_APIKEY_ME: ${{ secrets.CALLMEBOT_APIKEY_ME }}
        run: python -m pricebot.main

      - name: Save price memory
        run: |
          git config user.name "price-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update price state [skip ci]"
          git push
